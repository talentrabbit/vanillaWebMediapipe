<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gesture Particles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <section class="intro-strip">
      <p>Show one hand digit (0-9), keep it steady, and the particle field will morph into that number.</p>
    </section>

    <section class="status-strip">
      <article class="status-card">
        <span class="status-label">Detected digit</span>
        <strong id="gestureValue">--</strong>
        <p id="gestureHint">Allow camera access and hold one digit steady for a moment.</p>
      </article>
      <article class="status-card preview-card">
        <span class="status-label">Current PNG</span>
        <img id="digitPreview" alt="Detected digit preview" />
      </article>
    </section>

    <section class="stage-panel">
      <div class="camera-card">
        <div class="camera-header">
          <span>MediaPipe camera</span>
          <span id="trackingState">Waiting for camera</span>
        </div>
        <div class="camera-stack">
          <video class="input-video" playsinline muted></video>
          <canvas class="output-canvas"></canvas>
        </div>
      </div>

      <div class="scene-card">
        <div class="scene-header">
          <span>Three.js particle renderer</span>
          <span>Dynamic number particles</span>
        </div>
        <canvas id="sceneCanvas"></canvas>
      </div>
    </section>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
